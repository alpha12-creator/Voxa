<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VOXA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#0E1013; --surface:#181B20; --surface2:#20242B; --border:#2A2E36;
  --text:#F2F3F5; --text2:#9AA0AC; --accent:#3D8BFF; --accent-text:#0E1013;
  --danger:#FF5C5C; --unread:#3D8BFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface2:#F0F2F5; --border:#E3E6EA;
  --text:#14161A; --text2:#6B7280; --accent:#2B6FE0; --accent-text:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; height:100%; overflow:hidden;
}
.topbar{
  padding:16px 18px 10px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.topbar h1{font-size:19px; font-weight:650; margin:0; letter-spacing:.2px;}
.topbar .sub{font-size:12px; color:var(--text2); margin-top:1px;}
.iconbtn{
  width:36px;height:36px;border-radius:10px;border:none;background:none;color:var(--text2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;
}
.iconbtn:active{background:var(--surface2);}
.icons{display:flex;gap:2px;}
.searchbar{padding:8px 16px; border-bottom:1px solid var(--border); flex-shrink:0; display:none;}
.searchbar.show{display:block;}
.searchbar input{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); font-size:14px; outline:none;
}
.view{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.view::-webkit-scrollbar{display:none;}
.list{list-style:none; margin:0; padding:0;}
.conv{
  display:flex; gap:12px; padding:12px 16px; align-items:center; cursor:pointer;
  border-bottom:1px solid var(--border); position:relative;
}
.conv:active{background:var(--surface2);}
.avatar{
  width:44px;height:44px;border-radius:50%;background:var(--surface2);color:var(--text2);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0;
  border:1px solid var(--border);
}
.conv-main{flex:1; min-width:0;}
.conv-row1{display:flex; justify-content:space-between; gap:8px;}
.conv-name{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px;}
.conv-time{font-size:11.5px; color:var(--text2); flex-shrink:0;}
.conv-preview{font-size:13px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
.conv.unread .conv-name{font-weight:700;}
.conv.unread .conv-preview{color:var(--text); font-weight:500;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--unread); flex-shrink:0;}
.pin-icon{font-size:11px; opacity:.7;}
.mute-icon{font-size:11px; opacity:.5;}
.empty{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:70%; color:var(--text2); text-align:center; padding:0 40px; gap:6px;
}
.empty .glyph{font-size:32px; margin-bottom:6px; opacity:.5;}
.empty p{margin:0; font-size:14px;}

.bottomnav{
  display:flex; border-top:1px solid var(--border); background:var(--surface); flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.navbtn{
  flex:1; border:none; background:none; padding:9px 0 8px; display:flex; flex-direction:column;
  align-items:center; gap:3px; color:var(--text2); font-size:10.5px; cursor:pointer;
}
.navbtn .ni{font-size:19px;}
.navbtn.active{color:var(--accent);}

/* conversation thread */
.thread-top{display:flex; align-items:center; gap:10px; padding:14px 14px; border-bottom:1px solid var(--border); flex-shrink:0;}
.thread-top .name{font-weight:650; font-size:15px;}
.thread-top .num{font-size:11.5px; color:var(--text2);}
.thread{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px;}
.bubble{max-width:75%; padding:9px 12px; border-radius:16px; font-size:14px; line-height:1.35; position:relative;}
.bubble.in{align-self:flex-start; background:var(--surface2); border-bottom-left-radius:5px;}
.bubble.out{align-self:flex-end; background:var(--accent); color:var(--accent-text); border-bottom-right-radius:5px;}
.bubble .meta{font-size:10px; opacity:.65; margin-top:3px; display:flex; gap:4px; align-items:center;}
.composer{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--border); flex-shrink:0; align-items:center;}
.composer input{
  flex:1; border-radius:20px; border:1px solid var(--border); background:var(--surface2);
  color:var(--text); padding:10px 15px; font-size:14px; outline:none;
}
.sendbtn{
  width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-text);
  border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:16px; flex-shrink:0;
}
.emojiPanel{
  display:none; grid-template-columns:repeat(8,1fr); gap:4px; padding:10px 12px; border-top:1px solid var(--border);
  max-height:140px; overflow-y:auto;
}
.emojiPanel button{background:none;border:none;font-size:20px;padding:6px 0;cursor:pointer;border-radius:8px;}
.emojiPanel button:active{background:var(--surface2);}
.schedulePanel{
  display:none; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--border); flex-wrap:wrap;
}
.schedulePanel input[type="datetime-local"]{
  flex:1; min-width:150px; padding:8px 10px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); font-size:13px;
}
.schedulePanel button{
  padding:8px 14px; border-radius:9px; border:1px solid var(--border); background:var(--surface2);
  color:var(--text); font-size:13px; cursor:pointer;
}
.schedulePanel button.primary{background:var(--accent); color:var(--accent-text); border-color:var(--accent);}
.filechip{display:flex; align-items:center; gap:9px; font-size:13px;}
.bubble.scheduled{border:1px dashed var(--text2); background:transparent;}
.bubble.scheduled.out{color:var(--text);}

/* settings */
.settings{padding:14px 0;}
.sec-title{font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--text2); padding:14px 16px 6px;}
.row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border);}
.row .label{font-size:14px;}
.row .val{font-size:12.5px; color:var(--text2);}
.swatches{display:flex; gap:10px; padding:4px 16px 14px;}
.sw{width:28px;height:28px;border-radius:50%; border:2px solid transparent; cursor:pointer;}
.sw.selected{border-color:var(--text);}
.switch{width:42px;height:24px;border-radius:12px;background:var(--surface2); border:1px solid var(--border); position:relative; cursor:pointer;}
.switch .knob{width:18px;height:18px;border-radius:50%;background:var(--text2); position:absolute; top:2px; left:2px; transition:.15s;}
.switch.on{background:var(--accent);}
.switch.on .knob{left:20px; background:#fff;}
.seg{display:flex; gap:6px; padding:8px 16px 14px;}
.seg button{flex:1; padding:8px 0; border-radius:9px; border:1px solid var(--border); background:var(--surface2); color:var(--text2); font-size:12.5px; cursor:pointer;}
.seg button.on{background:var(--accent); color:var(--accent-text); border-color:var(--accent);}
.about{padding:24px 16px; text-align:center; color:var(--text2); font-size:12.5px;}
.about .v{font-weight:700; font-size:17px; color:var(--text); letter-spacing:.5px;}

.menu-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:10;}
.menu-backdrop.show{display:block;}
.menu{position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; z-index:11;}
.menu button{width:100%; text-align:left; padding:13px 16px; background:none; border:none; color:var(--text); font-size:14px; border-bottom:1px solid var(--border); cursor:pointer;}
.menu button:last-child{border-bottom:none;}
.menu button.danger{color:var(--danger);}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div style="display:flex;align-items:center;gap:6px;min-width:0;">
    <button class="iconbtn" id="backBtn" onclick="setTab('messages')" style="display:none">←</button>
    <div><h1 id="tb-title">VOXA</h1><div class="sub" id="tb-sub">Private. Simple. Yours.</div></div>
  </div>
  <div class="icons">
    <button class="iconbtn" id="searchBtn" onclick="toggleSearch()">🔍</button>
    <button class="iconbtn" id="moreBtn" onclick="openMoreMenu()">⋮</button>
  </div>
</div>
<div class="searchbar" id="searchbar"><input id="searchInput" placeholder="Search name, number or message" oninput="render()"></div>

<div class="view" id="view"></div>

<div class="menu-backdrop" id="menuBackdrop" onclick="closeMenu()"></div>
<div class="menu" id="menu"></div>

<script>
const ACCENTS = {blue:'#3D8BFF', green:'#34C77B', purple:'#9B6DFF', orange:'#FF9840', pink:'#FF5C9E'};
let state = {
  tab:'messages', theme:'dark', accent:'blue', search:'', openConv:null,
  convos:[]
};

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem('voxa_state'));
    if(saved) state = Object.assign(state, saved);
  }catch(e){}
  if(!state.convos || !state.convos.length) seedData();
}
function saveState(){
  try{ localStorage.setItem('voxa_state', JSON.stringify(state)); }catch(e){}
}
function seedData(){
  const now = Date.now();
  state.convos = [
    {id:1, name:'Zawadi', number:'+255 712 345 678', pinned:true, muted:false, archived:false, deleted:false, keepArchived:false,
      msgs:[
        {id:1,dir:'in',text:'Habari! Uko wapi leo?',time:now-1000*60*60*3,starred:false},
        {id:2,dir:'out',text:'Niko njiani, nitafika saa mbili.',time:now-1000*60*60*2,starred:false,status:'delivered'},
      ]},
    {id:2, name:'', number:'+255 655 210 992', pinned:false, muted:false, archived:false, deleted:false, keepArchived:false,
      msgs:[
        {id:1,dir:'in',text:'Your OTP code is 483920. Do not share it.',time:now-1000*60*40,starred:true},
      ]},
    {id:3, name:'Baraka - Client', number:'+255 788 004 411', pinned:false, muted:true, archived:false, deleted:false, keepArchived:false,
      msgs:[
        {id:1,dir:'out',text:'Draft ya CV yako iko tayari, naomba maoni.',time:now-1000*60*60*20,starred:false,status:'delivered'},
        {id:2,dir:'in',text:'Asante sana, nitaangalia leo jioni.',time:now-1000*60*60*19,starred:false},
      ]},
    {id:4, name:'Neema', number:'+255 621 887 034', pinned:false, muted:false, archived:false, deleted:false, keepArchived:false,
      msgs:[
        {id:1,dir:'in',text:'Umekumbuka mkutano wa kesho asubuhi?',time:now-1000*60*60*30,starred:false},
      ]},
  ];
  state.convos[1].unread = true;
  saveState();
}

function fmtTime(ts){
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString()===now.toDateString();
  if(sameDay) return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const diffDays = Math.floor((now-d)/86400000);
  if(diffDays===1) return 'Yesterday';
  if(diffDays<7) return d.toLocaleDateString([], {weekday:'short'});
  return d.toLocaleDateString([], {month:'short', day:'numeric'});
}
function initials(c){
  const n = c.name || c.number;
  return n.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
}
function lastMsg(c){ return c.msgs[c.msgs.length-1]; }

function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.style.setProperty('--accent', ACCENTS[state.accent]);
}

function setTab(t){
  state.tab = t; state.openConv=null; state.search=''; 
  document.getElementById('searchInput').value='';
  document.getElementById('searchbar').classList.remove('show');
  saveState(); render();
}
function toggleSearch(){
  if(state.openConv) return;
  document.getElementById('searchbar').classList.toggle('show');
  document.getElementById('searchInput').focus();
}

function render(){
  applyTheme();
  state.search = document.getElementById('searchInput').value.toLowerCase();
  const view = document.getElementById('view');
  const moreBtn = document.getElementById('moreBtn');
  const backBtn = document.getElementById('backBtn');
  const searchBtn = document.getElementById('searchBtn');
  const searchbar = document.getElementById('searchbar');
  const topbar = document.getElementById('topbar');

  if(state.openConv){
    topbar.style.display='none'; searchbar.classList.remove('show');
    renderThread(view, state.openConv);
    return;
  }
  topbar.style.display='flex';
  document.getElementById('tb-title').textContent = state.tab==='settings' ? 'Settings' : titleCase(state.tab);
  document.getElementById('tb-sub').textContent = state.tab==='messages' ? 'Private. Simple. Yours.' : '';
  backBtn.style.display = state.tab==='messages' ? 'none' : 'flex';
  searchBtn.style.display = state.tab==='settings' ? 'none' : 'flex';
  moreBtn.style.display = 'flex';

  if(state.tab==='messages') renderList(view, state.convos.filter(c=>!c.archived && !c.deleted), {kind:'inbox'});
  else if(state.tab==='archive') renderList(view, state.convos.filter(c=>c.archived && !c.deleted), {kind:'archive'});
  else if(state.tab==='bin') renderList(view, state.convos.filter(c=>c.deleted), {kind:'bin'});
  else if(state.tab==='settings') renderSettings(view);
}
function titleCase(s){return s[0].toUpperCase()+s.slice(1);}

function renderList(view, list, opts){
  const q = state.search;
  if(q){
    list = list.filter(c => (c.name||'').toLowerCase().includes(q) || c.number.includes(q) ||
      c.msgs.some(m=>m.text.toLowerCase().includes(q)));
  }
  list = list.slice().sort((a,b)=>{
    if(opts.kind==='inbox' && a.pinned!==b.pinned) return b.pinned-a.pinned;
    return lastMsg(b).time - lastMsg(a).time;
  });
  if(!list.length){
    const empties = {
      inbox: ['💬','Your conversations will appear here.'],
      archive: ['🗄️','No archived conversations.'],
      bin: ['🗑️','Your bin is empty.'],
    };
    const [glyph,text] = empties[opts.kind];
    view.innerHTML = `<div class="empty"><div class="glyph">${glyph}</div><p>${text}</p></div>`;
    return;
  }
  const ul = document.createElement('ul');
  ul.className='list';
  list.forEach(c=>{
    const li = document.createElement('li');
    li.className = 'conv' + (c.unread ? ' unread':'');
    const lm = lastMsg(c);
    li.innerHTML = `
      <div class="avatar">${initials(c)}</div>
      <div class="conv-main">
        <div class="conv-row1">
          <div class="conv-name">${c.pinned?'<span class="pin-icon">📌</span>':''}${c.muted?'<span class="mute-icon">🔇</span>':''}${escapeHtml(c.name||c.number)}</div>
          <div class="conv-time">${fmtTime(lm.time)}</div>
        </div>
        <div class="conv-preview">${escapeHtml((lm.dir==='out'?'You: ':'')+lm.text)}</div>
      </div>
      ${c.unread?'<div class="dot"></div>':''}
    `;
    li.onclick = ()=>{ if(c.unread){c.unread=false; saveState();} state.openConv=c.id; render(); };
    li.oncontextmenu = (e)=>{e.preventDefault(); openConvMenu(c, opts.kind);};
    let pressTimer;
    li.addEventListener('touchstart', ()=>{ pressTimer=setTimeout(()=>openConvMenu(c,opts.kind), 480); });
    li.addEventListener('touchend', ()=>clearTimeout(pressTimer));
    ul.appendChild(li);
  });
  view.innerHTML=''; view.appendChild(ul);
}

function findConv(id){ return state.convos.find(c=>c.id===id); }

function openConvMenu(c, kind){
  const items = [];
  if(kind==='inbox'){
    items.push([c.pinned?'Unpin':'Pin', ()=>{c.pinned=!c.pinned;}]);
    items.push([c.unread?'Mark as read':'Mark as unread', ()=>{c.unread=!c.unread;}]);
    items.push([c.muted?'Unmute':'Mute', ()=>{c.muted=!c.muted;}]);
    items.push(['Archive', ()=>{c.archived=true;}]);
    items.push(['Delete', ()=>{c.deleted=true; c.deletedAt=Date.now();}, 'danger']);
    items.push(['Block contact', ()=>{ if(confirm('Block '+(c.name||c.number)+'? VOXA will filter future messages from this number where your device supports it.')) c.blocked=true; }, 'danger']);
  } else if(kind==='archive'){
    items.push(['Restore to inbox', ()=>{c.archived=false;}]);
    items.push([c.keepArchived?'Allow new messages to un-archive':'Keep archived on new messages', ()=>{c.keepArchived=!c.keepArchived;}]);
    items.push(['Delete', ()=>{c.deleted=true; c.deletedAt=Date.now();}, 'danger']);
  } else if(kind==='bin'){
    items.push(['Restore', ()=>{c.deleted=false; c.archived=false;}]);
    items.push(['Delete permanently', ()=>{ if(confirm('Permanently delete this conversation? This cannot be undone.')){ state.convos = state.convos.filter(x=>x.id!==c.id); } }, 'danger']);
  }
  showMenu(items);
}
function openMoreMenu(){
  const items = [];
  if(state.tab==='messages'){
    items.push(['Mark all as read', ()=>{ state.convos.forEach(c=>c.unread=false); }]);
  }
  if(state.tab==='bin'){
    items.push(['Empty bin', ()=>{
      if(confirm('Permanently delete all conversations in Bin?')){
        state.convos = state.convos.filter(c=>!c.deleted);
      }
    }, 'danger']);
  }
  if(state.tab!=='messages') items.push(['Messages', ()=>setTab('messages')]);
  if(state.tab!=='archive') items.push(['Archive', ()=>setTab('archive')]);
  if(state.tab!=='bin') items.push(['Bin', ()=>setTab('bin')]);
  if(state.tab!=='settings') items.push(['Settings', ()=>setTab('settings')]);
  showMenu(items);
}
function showMenu(items){
  const menu = document.getElementById('menu');
  menu.innerHTML = items.map((it,i)=>`<button class="${it[2]||''}" data-i="${i}">${it[0]}</button>`).join('');
  [...menu.children].forEach((btn,i)=>{
    btn.onclick = ()=>{ items[i][1](); saveState(); closeMenu(); render(); };
  });
  document.getElementById('menuBackdrop').classList.add('show');
  menu.style.display='block';
}
function closeMenu(){
  document.getElementById('menuBackdrop').classList.remove('show');
  document.getElementById('menu').style.display='none';
}

function renderThread(view, id){
  const c = findConv(id);
  if(!c){ state.openConv=null; render(); return; }
  const wrap = document.createElement('div');
  wrap.style.cssText='display:flex;flex-direction:column;height:100%;';
  wrap.innerHTML = `
    <div class="thread-top">
      <button class="iconbtn" onclick="state.openConv=null; render();">←</button>
      <div style="flex:1">
        <div class="name">${escapeHtml(c.name||c.number)}</div>
        ${c.name?`<div class="num">${c.number}</div>`:''}
      </div>
      <button class="iconbtn" onclick="openConvMenu(findConv(${c.id}), 'inbox')">⋮</button>
    </div>
    <div class="thread" id="threadMsgs"></div>
    <div class="emojiPanel" id="emojiPanel"></div>
    <div class="schedulePanel" id="schedulePanel">
      <input type="datetime-local" id="scheduleInput">
      <button class="primary" onclick="confirmSchedule(${c.id})">Schedule</button>
      <button onclick="cancelSchedule()">Cancel</button>
    </div>
    <div class="composer">
      <button class="iconbtn" onclick="openAttachMenu(${c.id})">📎</button>
      <button class="iconbtn" onclick="toggleEmojiPanel()">😊</button>
      <input id="composerInput" placeholder="Message">
      <button class="iconbtn" onclick="toggleSchedulePanel()">🕒</button>
      <button class="sendbtn" onclick="sendMsg(${c.id})">➤</button>
    </div>
    <input type="file" id="fileInputPhoto" accept="image/*" style="display:none" onchange="handleFile(event,${c.id},'image')">
    <input type="file" id="fileInputFile" style="display:none" onchange="handleFile(event,${c.id},'file')">
  `;
  view.innerHTML=''; view.appendChild(wrap);
  const box = document.getElementById('threadMsgs');
  c.msgs.forEach(m=>{
    const b = document.createElement('div');
    b.className = 'bubble ' + (m.dir==='in'?'in':'out') + (m.status==='scheduled'?' scheduled':'');
    let bodyHtml;
    if(m.type==='image') bodyHtml = `<img src="${m.dataUrl}" style="max-width:100%;border-radius:10px;display:block;">`;
    else if(m.type==='file') bodyHtml = `<div class="filechip">📄<div><div style="font-weight:600">${escapeHtml(m.name)}</div><div style="font-size:11px;opacity:.7">${m.size}</div></div></div>`;
    else if(m.type==='contact') bodyHtml = `<div class="filechip">👤<div><div style="font-weight:600">${escapeHtml(m.name)}</div><div style="font-size:11px;opacity:.7">${escapeHtml(m.number)}</div></div></div>`;
    else bodyHtml = escapeHtml(m.text);
    const metaText = m.status==='scheduled' ? ('🕒 Scheduled · '+fmtTime(m.scheduledTime)) : (fmtTime(m.time)+(m.starred?' · ⭐':'')+(m.status && m.status!=='scheduled' ? ' · '+m.status:''));
    b.innerHTML = `${bodyHtml}<div class="meta">${metaText}</div>`;
    b.ondblclick = ()=>{ m.starred=!m.starred; saveState(); render(); };
    box.appendChild(b);
  });
  box.scrollTop = box.scrollHeight;
  document.getElementById('composerInput').addEventListener('keydown', e=>{
    if(e.key==='Enter') sendMsg(c.id);
  });
}
function sendMsg(id){
  const input = document.getElementById('composerInput');
  const text = input.value.trim();
  if(!text) return;
  const c = findConv(id);
  c.msgs.push({id:c.msgs.length+1, dir:'out', text, time:Date.now(), starred:false, status:'sent'});
  input.value='';
  saveState(); render();
}
function toggleEmojiPanel(){
  const panel = document.getElementById('emojiPanel');
  document.getElementById('schedulePanel').style.display='none';
  const isOpen = panel.style.display==='grid';
  if(isOpen){ panel.style.display='none'; return; }
  if(!panel.dataset.built){
    const emojis = ['😀','😂','😍','👍','🙏','🔥','🎉','😢','😅','❤️','😎','🤔','👏','🙌','💯','😴','😇','🤝','📌','⭐','😡','🥳','👀','✅'];
    panel.innerHTML = emojis.map(e=>`<button type="button" onclick="insertEmoji('${e}')">${e}</button>`).join('');
    panel.dataset.built='1';
  }
  panel.style.display='grid';
}
function insertEmoji(e){
  const input = document.getElementById('composerInput');
  input.value += e;
  input.focus();
}
function toggleSchedulePanel(){
  const panel = document.getElementById('schedulePanel');
  document.getElementById('emojiPanel').style.display='none';
  const isOpen = panel.style.display==='flex';
  if(isOpen){ panel.style.display='none'; return; }
  const d = new Date(Date.now()+15*60000);
  d.setSeconds(0,0);
  document.getElementById('scheduleInput').value = new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  panel.style.display='flex';
}
function cancelSchedule(){ document.getElementById('schedulePanel').style.display='none'; }
function confirmSchedule(id){
  const input = document.getElementById('composerInput');
  const text = input.value.trim();
  const dt = document.getElementById('scheduleInput').value;
  if(!text){ alert('Write a message to schedule.'); return; }
  if(!dt){ alert('Pick a date and time.'); return; }
  const when = new Date(dt).getTime();
  if(when <= Date.now()){ alert('Pick a time in the future.'); return; }
  const c = findConv(id);
  c.msgs.push({id:c.msgs.length+1, dir:'out', text, time:when, scheduledTime:when, status:'scheduled', starred:false});
  input.value='';
  document.getElementById('schedulePanel').style.display='none';
  saveState(); render();
}
function openAttachMenu(id){
  showMenu([
    ['Photo', ()=>document.getElementById('fileInputPhoto').click()],
    ['File', ()=>document.getElementById('fileInputFile').click()],
    ['Contact', ()=>attachContact(id)],
  ]);
}
function attachContact(id){
  const name = prompt('Contact name?');
  if(!name) return;
  const number = prompt('Phone number?') || '';
  const c = findConv(id);
  c.msgs.push({id:c.msgs.length+1, dir:'out', type:'contact', name, number, time:Date.now(), starred:false, status:'sent'});
  saveState(); render();
}
function handleFile(evt, id, kind){
  const file = evt.target.files[0];
  if(!file) return;
  const c = findConv(id);
  if(kind==='image'){
    const reader = new FileReader();
    reader.onload = ()=>{
      c.msgs.push({id:c.msgs.length+1, dir:'out', type:'image', dataUrl:reader.result, time:Date.now(), starred:false, status:'sent'});
      saveState(); render();
    };
    reader.readAsDataURL(file);
  } else {
    const sizeKb = Math.max(1, Math.round(file.size/1024));
    c.msgs.push({id:c.msgs.length+1, dir:'out', type:'file', name:file.name, size:sizeKb+' KB', time:Date.now(), starred:false, status:'sent'});
    saveState(); render();
  }
  evt.target.value='';
}
function checkScheduled(){
  const now = Date.now();
  let changed=false;
  state.convos.forEach(c=>{
    c.msgs.forEach(m=>{
      if(m.status==='scheduled' && m.scheduledTime<=now){
        m.status='sent'; m.time=now; delete m.scheduledTime; changed=true;
      }
    });
  });
  if(changed){ saveState(); render(); }
}
setInterval(checkScheduled, 5000);

function renderSettings(view){
  const s = document.createElement('div');
  s.className='settings';
  s.innerHTML = `
    <div class="sec-title">Appearance</div>
    <div class="seg" id="themeSeg">
      <button data-v="dark">Dark</button>
      <button data-v="light">Light</button>
    </div>
    <div class="row"><div class="label">Accent color</div></div>
    <div class="swatches" id="accentRow"></div>

    <div class="sec-title">Archive</div>
    <div class="row"><div class="label">Keep archived by default</div><div class="switch" id="swKeepArchived"><div class="knob"></div></div></div>

    <div class="sec-title">Bin</div>
    <div class="row"><div class="label">Auto-delete period</div><div class="val">${state.binDays||30} days</div></div>
    <div class="row" style="cursor:pointer" onclick="emptyBinFromSettings()"><div class="label" style="color:var(--danger)">Empty bin</div></div>

    <div class="sec-title">Notifications</div>
    <div class="row"><div class="label">Enable notifications</div><div class="switch on" id="swNotif"><div class="knob"></div></div></div>
    <div class="row"><div class="label">Hide message preview</div><div class="switch" id="swHidePreview"><div class="knob"></div></div></div>

    <div class="sec-title">Default SMS app</div>
    <div class="row" style="cursor:pointer" onclick="alert('This opens Android\\'s system dialog to set VOXA as your default SMS app — required for VOXA to send and receive messages.')"><div class="label" style="color:var(--accent)">Set VOXA as default SMS app</div></div>

    <div class="about">
      <div class="v">VOXA</div>
      <div style="margin-top:4px">Version 1.0.0</div>
      <div style="margin-top:2px">Private. Simple. Yours.</div>
    </div>
  `;
  view.innerHTML=''; view.appendChild(s);

  const themeSeg = s.querySelector('#themeSeg');
  [...themeSeg.children].forEach(btn=>{
    btn.classList.toggle('on', btn.dataset.v===state.theme);
    btn.onclick = ()=>{ state.theme=btn.dataset.v; saveState(); render(); };
  });
  const accentRow = s.querySelector('#accentRow');
  Object.keys(ACCENTS).forEach(key=>{
    const sw = document.createElement('div');
    sw.className='sw'+(state.accent===key?' selected':'');
    sw.style.background=ACCENTS[key];
    sw.onclick=()=>{ state.accent=key; saveState(); render(); };
    accentRow.appendChild(sw);
  });
  bindSwitch(s.querySelector('#swKeepArchived'), !!state.defaultKeepArchived, v=>{state.defaultKeepArchived=v;});
  bindSwitch(s.querySelector('#swNotif'), state.notif!==false, v=>{state.notif=v;});
  bindSwitch(s.querySelector('#swHidePreview'), !!state.hidePreview, v=>{state.hidePreview=v;});
}
function bindSwitch(el, on, onChange){
  el.classList.toggle('on', on);
  el.onclick = ()=>{ const now = !el.classList.contains('on'); el.classList.toggle('on', now); onChange(now); saveState(); };
}
function emptyBinFromSettings(){
  const n = state.convos.filter(c=>c.deleted).length;
  if(!n){ alert('Your bin is already empty.'); return; }
  if(confirm('Permanently delete '+n+' conversation(s) in Bin?')){
    state.convos = state.convos.filter(c=>!c.deleted);
    saveState(); alert('Bin emptied.');
  }
}
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadState();
render();
</script>
</body>
</html>
